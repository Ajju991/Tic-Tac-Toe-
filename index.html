o<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="start-screen">
    <!-- Start screen content -->
  </div>
  
  <div id="device-screen" class="hidden">
    <!-- Device selection screen -->
  </div>
  
  <div id="mode-screen" class="hidden">
    <!-- Mode selection screen -->
  </div>
  
  <div id="game-screen" class="hidden">
    <div id="turnIndicator"></div>
    <div id="board-container" class="board"></div>
    <button id="soundToggle">Mute Sound</button>
    <button onclick="resetGame()">Reset Game</button>
    <audio id="bg-music" src="background.wav" loop autoplay></audio>
    <audio id="move-sound" src="move.wav"></audio>
    <audio id="win-sound" src="win.wav"></audio>
    <audio id="draw-sound" src="draw.wav"></audio>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script src="script.js"></script>
</body>
</html>
